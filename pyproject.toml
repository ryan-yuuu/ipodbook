[project]
name = "ipodbook"
version = "0.1.0"
description = "Build iPod-compatible M4B audiobooks from loose audio files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.5", "mutagen>=1.45"]

[project.scripts]
# Opens the GUI; `ipodbook cli ...` reaches the command line. Matches
# `python -m ipodbook`, so both entry points behave identically.
ipodbook = "ipodbook.__main__:main"

[project.gui-scripts]
# Same GUI without a console window attached on Windows.
ipodbook-gui = "ipodbook.gui.app:run"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ipodbook*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
