[project]
name = "ipodbook"
version = "0.1.0"
description = "Build iPod-compatible M4B audiobooks from loose audio files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.5", "mutagen>=1.45"]

[project.scripts]
ipodbook = "ipodbook.cli:main"

[project.gui-scripts]
ipodbook-gui = "ipodbook.gui.app:run"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ipodbook*"]
